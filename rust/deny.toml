# cargo-deny: every crate, including sub-dependencies, must be permissive
# (TECH-STACK.md step 2). Run: cargo deny --manifest-path rust/Cargo.toml check
[licenses]
allow = [
    "MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause", "BSD-3-Clause", "BSD-3-Clause-Clear", "ISC", "Zlib",
    "BSL-1.0", "CC0-1.0", "Unlicense", "0BSD", "Unicode-3.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"

[advisories]
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
