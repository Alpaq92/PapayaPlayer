name: BSD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bsd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# FreeBSD, NetBSD and OpenBSD in virtual machines on Linux runners, the same
# versions and action as Reaktor's own BSD CI.
jobs:
  bsd:
    name: ${{ matrix.os }} ${{ matrix.version }} ${{ matrix.libs }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [freebsd, openbsd, netbsd]
        libs: [shared, static]
        include:
          - { os: freebsd, version: '15.1' }
          - { os: openbsd, version: '7.9' }
          - { os: netbsd, version: '11.0' }
    defaults:
      run:
        shell: cpa.sh {0} --sync-files none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Start VM
        uses: cross-platform-actions/action@e0b9770014ba65d5e0815f15b74031c3a635f641 # v1.6.0
        with:
          operating_system: ${{ matrix.os }}
          version: ${{ matrix.version }}
          architecture: x86-64
          shell: sh
          cpu_count: 4
          memory: 8G
          sync_files: runner-to-vm

      - name: Install packages
        run: |
          PATH=/usr/pkg/sbin:/usr/pkg/bin:/usr/local/sbin:/usr/local/bin:$PATH
          export PATH
          case "$(uname -s)" in
            FreeBSD)
              sudo env IGNORE_OSVERSION=yes pkg install -y cmake-core ninja pkgconf rust dbus \
                libX11 libXext libXcursor libXi libXfixes libXrandr libXrender libXtst \
                libxkbcommon wayland wayland-protocols libglvnd </dev/null ;;
            OpenBSD)
              sudo pkg_add -I cmake-core ninja rust dbus libxkbcommon wayland wayland-protocols </dev/null ;;
            NetBSD)
              sudo sed -i.orig 's#^ftp://ftp\.NetBSD\.org#https://cdn.NetBSD.org#' /usr/pkg/etc/pkgin/repositories.conf
              sudo -E pkgin -y update </dev/null
              sudo -E pkgin -y install cmake ninja-build pkgconf rust dbus libxkbcommon wayland \
                wayland-protocols clang lld llvm </dev/null ;;
          esac

      - name: Build and test
        run: |
          PATH=/usr/pkg/sbin:/usr/pkg/bin:/usr/local/sbin:/usr/local/bin:$PATH
          export PATH
          uname -a
          clang --version
          cargo --version
          ./build.sh -t -- -DPAPAYA_SHARED_LIBS=${{ matrix.libs == 'shared' && 'ON' || 'OFF' }} </dev/null
